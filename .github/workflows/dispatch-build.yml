name: Announce a revision to autobuilds

# Discovery starts here: every commit that lands on the development branch
# is a new build input for every profile this tree publishes. Autobuilds
# deduplicates by build_id, so announcing an input it already built costs one
# job and no build runners.
on:
  push:
    branches: [master]

jobs:
  announce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Ask autobuilds to build this revision
        env:
          GH_TOKEN: ${{ secrets.REPO_DISPATCH_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$GH_TOKEN" ]]; then
            echo "::error::REPO_DISPATCH_TOKEN secret is required for cross-repo dispatch to vitasdk/autobuilds"
            exit 1
          fi
          ./scripts/announce-builds.py \
            --repository vitasdk/autobuilds \
            --revision "$GITHUB_SHA"
