name: Build

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

env:
  DEBIAN_DEPS: cmake cmake-data git build-essential autoconf automake libtool texinfo bison flex pkg-config ccache

jobs:
  # Structural checks that need no build: the stage-1/stage-2 partition
  # manifest and the host binary format guard.
  checks:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Run the cmake script tests
      run: |
        for script in tests/cmake/*.cmake; do
          case "$script" in
            *-check.cmake) continue ;;
          esac
          echo "== $script"
          cmake -P "$script"
        done

  # ---------------------------------------------------------------------
  # Stage 1: the only job that compiles target code, and it compiles
  # nothing else. Out comes the target half -- sysroot, newlib, the stubs,
  # libgcc and the target runtimes -- which every host imports. It is not
  # an SDK for anyone, not even for this runner: Linux x86_64 gets its own
  # SDK from stage 2, like every other host.
  # ---------------------------------------------------------------------
  stage1:
    runs-on: ubuntu-24.04
    env:
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
      CCACHE_COMPRESSLEVEL: "6"
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $DEBIAN_DEPS
    - name: Enable ccache
      run: |
        # gcc, binutils, gdb and newlib are autotools: they honour no CMake
        # variable, and a shim directory in PATH is the only way they pick
        # ccache up. Listing it leaves the covered compilers in the log.
        if [ -x /usr/sbin/update-ccache-symlinks ]; then
          sudo /usr/sbin/update-ccache-symlinks
        fi
        ls /usr/lib/ccache
        echo /usr/lib/ccache >> $GITHUB_PATH
        # A job env block runs through no shell, so CCACHE_DIR=~/.ccache
        # reached ccache as a literal tilde and it cached into a directory
        # named "~" wherever each sub-build happened to run. Expand it here.
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
    - name: ccache
      uses: actions/cache@v6
      with:
        path: ~/.ccache
        key: stage1-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          stage1-ccache-${{ github.ref }}-
          stage1-ccache-
    - name: downloads
      uses: actions/cache@v6
      with:
        path: build/downloads
        key: ${{ runner.os }}-downloads-${{ hashFiles('CMakeLists.txt', 'cmake/Components.cmake') }}
        restore-keys: |
          ${{ runner.os }}-downloads-
    - name: Build
      run: |
        git config --global user.email "builds@ci.invalid"
        git config --global user.name "CI"
        mkdir -p build
        cd build
        cmake .. -DVITASDK_TARGET_ONLY=ON
        make -j$(nproc) sysroot
    - name: ccache statistics
      if: ${{ always() }}
      run: ccache --show-stats
    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: vitasdk-sysroot
        path: build/vitasdk-sysroot-*.tar.bz2

  # ---------------------------------------------------------------------
  # Stage 2: cross builds that consume the stage-1 SDK. Only the host
  # binaries are compiled; the native toolchain and the target sysroot are
  # imported, so these jobs are much faster than a full build.
  # ---------------------------------------------------------------------
  stage2:
    needs: stage1
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 is a consumer like the rest: the runner that built
          # the target half has no privileged claim to an SDK.
          - name: linux-x86_64
            cmake_extra: ""
          - name: windows-x86_64
            cmake_extra: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/x86_64-w64-mingw32.cmake
            apt: g++-mingw-w64-x86-64
          - name: windows-i686
            cmake_extra: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/i686-w64-mingw32.cmake
            apt: g++-mingw-w64-i686
          - name: linux-musl-x86_64
            cmake_extra: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/x86_64-linux-musl.cmake
            musl: x86_64-unknown-linux-musl
          - name: linux-musl-aarch64
            cmake_extra: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-linux-musl.cmake
            musl: aarch64-unknown-linux-musl
          - name: freebsd-x86_64
            cmake_extra: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/x86_64-unknown-freebsd.cmake
            freebsd: "14.3"
            freebsd_arch: x86_64
            apt: clang lld llvm
          - name: freebsd-aarch64
            cmake_extra: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/aarch64-unknown-freebsd.cmake
            freebsd: "14.3"
            freebsd_arch: aarch64
            apt: clang lld llvm
    env:
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
      CCACHE_COMPRESSLEVEL: "6"
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $DEBIAN_DEPS ${{ matrix.apt }}
    - name: Install musl cross toolchain
      if: ${{ matrix.musl }}
      env:
        # Pinned to a release whose gcc is the one we build, 15.2. The 20260515
        # release ships gcc 16, which cannot compile gcc 15's libcody: it
        # defaults to a newer C++ where u8"" is const char8_t, and S2C takes
        # const char. A host compiler ahead of the sources is not a free
        # upgrade -- and a toolchain that changes under us changes the SDK.
        MUSL_CROSS_RELEASE: "20260430"
      run: |
        base=https://github.com/cross-tools/musl-cross/releases/download/$MUSL_CROSS_RELEASE
        for suffix in tar.xz tar.xz.sha256; do
          curl -fL --retry 5 --retry-all-errors --retry-delay 5 \
            -O "$base/${{ matrix.musl }}.$suffix"
        done
        # The published checksum is the bare hash, without a file name.
        echo "$(cat ${{ matrix.musl }}.tar.xz.sha256)  ${{ matrix.musl }}.tar.xz" \
          | sha256sum -c -
        sudo tar -xJf ${{ matrix.musl }}.tar.xz -C /opt
        # These toolchains carry the vendor field; the SDK names the same host
        # without it (x86_64-linux-musl), and autotools looks its tools up by
        # that exact prefix. Alias every tool rather than rename the host.
        cd /opt/${{ matrix.musl }}/bin
        for tool in *-unknown-*; do
          sudo ln -sf "$tool" "$(echo "$tool" | sed 's/-unknown-/-/')"
        done
        echo "/opt/${{ matrix.musl }}/bin" >> $GITHUB_PATH
    - name: Install FreeBSD cross environment
      if: ${{ matrix.freebsd }}
      run: |
        sudo mkdir -p /opt/freebsd-cross
        sudo chown $(id -u) /opt/freebsd-cross
        sh scripts/setup-freebsd-cross.sh ${{ matrix.freebsd }} /opt/freebsd-cross ${{ matrix.freebsd_arch }}
        echo "/opt/freebsd-cross/bin" >> $GITHUB_PATH
    - name: Enable ccache
      run: |
        # gcc, binutils, gdb and newlib are autotools: they honour no CMake
        # variable, and a shim directory in PATH is the only way they pick
        # ccache up. Listing it leaves the covered compilers in the log.
        if [ -x /usr/sbin/update-ccache-symlinks ]; then
          sudo /usr/sbin/update-ccache-symlinks
        fi
        ls /usr/lib/ccache
        echo /usr/lib/ccache >> $GITHUB_PATH
        # A job env block runs through no shell, so CCACHE_DIR=~/.ccache
        # reached ccache as a literal tilde and it cached into a directory
        # named "~" wherever each sub-build happened to run. Expand it here.
        echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
    - name: ccache
      uses: actions/cache@v6
      with:
        path: ~/.ccache
        key: stage2-${{ matrix.name }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          stage2-${{ matrix.name }}-ccache-${{ github.ref }}-
          stage2-${{ matrix.name }}-ccache-
    - name: downloads
      uses: actions/cache@v6
      with:
        path: build/downloads
        key: ${{ runner.os }}-downloads-${{ hashFiles('CMakeLists.txt', 'cmake/Components.cmake') }}
        restore-keys: |
          ${{ runner.os }}-downloads-
    - name: Fetch the stage-1 sysroot
      uses: actions/download-artifact@v7
      with:
        name: vitasdk-sysroot
        path: stage1-artifact
    - name: Unpack the stage-1 sysroot
      run: |
        mkdir -p stage1
        tar -xjf stage1-artifact/*.tar.bz2 -C stage1
        STAGE1_DIR=$(dirname "$(dirname "$(dirname "$(find "$PWD/stage1" -type f -path '*/arm-vita-eabi/lib/libc.a' | head -1)")")")
        test -n "$STAGE1_DIR"
        echo "STAGE1_DIR=$STAGE1_DIR" >> $GITHUB_ENV
        echo "$STAGE1_DIR/bin" >> $GITHUB_PATH
    - name: Build
      run: |
        git config --global user.email "builds@ci.invalid"
        git config --global user.name "CI"
        unset CC CXX
        mkdir -p build
        cd build
        cmake .. -DVITASDK_STAGE1_DIR="$STAGE1_DIR" ${{ matrix.cmake_extra }}
        make -j$(nproc) tarball
    - name: Check the toolchain contract
      # Only where the SDK just built runs on this runner. It compiles and
      # links real code and checks the ABI both ways, which is the only
      # thing here that would notice a compiler that builds but does not
      # work -- and gcc is now built one way in stage 1 and another in
      # stage 2.
      if: ${{ matrix.cmake_extra == '' }}
      run: make -C build check-toolchain-contract
    - name: ccache statistics
      if: ${{ always() }}
      run: ccache --show-stats
    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: vitasdk-${{ matrix.name }}
        path: build/*.tar.bz2

  # ---------------------------------------------------------------------
  # Stage 2 on runners other than Linux x86_64: arm64 Linux and Apple
  # hardware. None of them can execute the stage-1 x86_64 Linux binaries,
  # and none of them has to -- the target half arrives as data, nothing
  # here compiles target code, and so no arm-vita-eabi compiler is built
  # on them either.
  #
  # Both macOS SDKs are produced on Apple silicon: arm64 natively, x86_64
  # through the same Xcode toolchain with -arch x86_64. Apple's SDK
  # licence keeps it on Apple hardware, which rules out osxcross in public
  # CI; building the other architecture on the vendor's own runner does
  # not need it. The Intel runners are being retired, so depending on them
  # is depending on something that is going away.
  # ---------------------------------------------------------------------
  stage2-native:
    needs: stage1
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            name: linux-arm64
            ccache_dir: ~/.ccache
            cmake_extra: ""
          - runner: macos-14
            name: macos-arm64
            ccache_dir: ~/Library/Caches/ccache
            cmake_extra: ""
          - runner: macos-14
            name: macos-x86_64
            ccache_dir: ~/Library/Caches/ccache
            cmake_extra: -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/x86_64-apple-darwin.cmake
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
      CCACHE_COMPRESSLEVEL: "6"
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
    - name: Install dependencies
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          brew install autoconf automake libtool texinfo ccache
        else
          sudo apt-get update
          sudo apt-get install -y $DEBIAN_DEPS
        fi
    - name: Set up the macOS x86_64 cross environment
      if: ${{ matrix.name == 'macos-x86_64' }}
      run: |
        scripts/setup-macos-cross.sh "$PWD/macos-cross"
        echo "$PWD/macos-cross/bin" >> $GITHUB_PATH
    - name: Enable ccache
      run: |
        # See the note in stage1: the autotools sub-builds only pick
        # ccache up through a shim directory in PATH.
        if [ "$RUNNER_OS" = "macOS" ]; then
          shims="$(brew --prefix ccache)/libexec"
        else
          if [ -x /usr/sbin/update-ccache-symlinks ]; then
            sudo /usr/sbin/update-ccache-symlinks
          fi
          shims=/usr/lib/ccache
        fi
        ls "$shims"
        echo "$shims" >> $GITHUB_PATH
        # See the note in stage1: the tilde needs a shell to expand it.
        if [ "$RUNNER_OS" = "macOS" ]; then
          echo "CCACHE_DIR=$HOME/Library/Caches/ccache" >> $GITHUB_ENV
        else
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV
        fi
    - name: ccache
      uses: actions/cache@v6
      with:
        path: ${{ matrix.ccache_dir }}
        key: stage2-${{ matrix.name }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          stage2-${{ matrix.name }}-ccache-${{ github.ref }}-
          stage2-${{ matrix.name }}-ccache-
    - name: downloads
      uses: actions/cache@v6
      with:
        path: build/downloads
        key: ${{ matrix.name }}-downloads-${{ hashFiles('CMakeLists.txt', 'cmake/Components.cmake') }}
        restore-keys: |
          ${{ matrix.name }}-downloads-
    - name: Fetch the stage-1 sysroot
      uses: actions/download-artifact@v7
      with:
        name: vitasdk-sysroot
        path: stage1-artifact
    - name: Unpack the stage-1 sysroot
      run: |
        mkdir -p stage1
        tar -xjf stage1-artifact/*.tar.bz2 -C stage1
        STAGE1_DIR=$(dirname "$(dirname "$(dirname "$(find "$PWD/stage1" -type f -path '*/arm-vita-eabi/lib/libc.a' | head -1)")")")
        test -n "$STAGE1_DIR"
        echo "STAGE1_DIR=$STAGE1_DIR" >> $GITHUB_ENV
    - name: Build
      run: |
        git config --global user.email "builds@ci.invalid"
        git config --global user.name "CI"
        mkdir -p build
        cd build
        cmake .. -DVITASDK_STAGE1_DIR="$STAGE1_DIR" ${{ matrix.cmake_extra }}
        make -j$(getconf _NPROCESSORS_ONLN) tarball
    - name: Check the toolchain contract
      # Only where the SDK just built runs on this runner. It compiles and
      # links real code and checks the ABI both ways, which is the only
      # thing here that would notice a compiler that builds but does not
      # work -- and gcc is now built one way in stage 1 and another in
      # stage 2.
      if: ${{ matrix.cmake_extra == '' }}
      run: make -C build check-toolchain-contract
    - name: ccache statistics
      if: ${{ always() }}
      run: ccache --show-stats
    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: vitasdk-${{ matrix.name }}
        path: build/*.tar.bz2
