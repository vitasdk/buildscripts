name: Build

on:
  push:
  pull_request:
  repository_dispatch:
    types: [run_build]

env:
  DEBIAN_DEPS: cmake cmake-data git build-essential autoconf automake libtool texinfo bison flex pkg-config ccache

jobs:
  # Structural checks that need no build: the stage-1/stage-2 partition
  # manifest and the host binary format guard.
  checks:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v7
    - name: Run the cmake script tests
      run: |
        for script in tests/cmake/*.cmake; do
          case "$script" in
            *-check.cmake) continue ;;
          esac
          echo "== $script"
          cmake -P "$script"
        done

  # ---------------------------------------------------------------------
  # Stage 1: the only job that compiles target code. It builds the whole
  # SDK natively on Linux x86_64, and its tarball carries the target half
  # -- sysroot, newlib, the stubs, libgcc and the target runtimes -- that
  # every other host imports instead of building.
  # ---------------------------------------------------------------------
  stage1-linux:
    runs-on: ubuntu-24.04
    env:
      CCACHE_DIR: ~/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
      CCACHE_COMPRESSLEVEL: "6"
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $DEBIAN_DEPS
    - name: Enable ccache
      run: |
        # gcc, binutils, gdb and newlib are autotools: they honour no CMake
        # variable, and a shim directory in PATH is the only way they pick
        # ccache up. Listing it leaves the covered compilers in the log.
        if [ -x /usr/sbin/update-ccache-symlinks ]; then
          sudo /usr/sbin/update-ccache-symlinks
        fi
        ls /usr/lib/ccache
        echo /usr/lib/ccache >> $GITHUB_PATH
    - name: ccache
      uses: actions/cache@v6
      with:
        path: ~/.ccache
        key: stage1-linux-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          stage1-linux-ccache-${{ github.ref }}-
          stage1-linux-ccache-
    - name: downloads
      uses: actions/cache@v6
      with:
        path: build/downloads
        key: ${{ runner.os }}-downloads-${{ hashFiles('CMakeLists.txt', 'cmake/Components.cmake') }}
        restore-keys: |
          ${{ runner.os }}-downloads-
    - name: Build
      run: |
        git config --global user.email "builds@ci.invalid"
        git config --global user.name "CI"
        mkdir -p build
        cd build
        cmake ..
        make -j$(nproc) tarball
    - name: ccache statistics
      if: ${{ always() }}
      run: ccache --show-stats
    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: vitasdk-linux
        path: build/*.tar.bz2

  # ---------------------------------------------------------------------
  # Stage 2: cross builds that consume the stage-1 SDK. Only the host
  # binaries are compiled; the native toolchain and the target sysroot are
  # imported, so these jobs are much faster than a full build.
  # ---------------------------------------------------------------------
  stage2:
    needs: stage1-linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            toolchain: cmake/toolchains/x86_64-w64-mingw32.cmake
            apt: g++-mingw-w64-x86-64
          - name: windows-i686
            toolchain: cmake/toolchains/i686-w64-mingw32.cmake
            apt: g++-mingw-w64-i686
          - name: linux-musl-x86_64
            toolchain: cmake/toolchains/x86_64-linux-musl.cmake
            musl: x86_64-linux-musl-cross
          - name: linux-musl-aarch64
            toolchain: cmake/toolchains/aarch64-linux-musl.cmake
            musl: aarch64-linux-musl-cross
          - name: freebsd-x86_64
            toolchain: cmake/toolchains/x86_64-unknown-freebsd.cmake
            freebsd: "14.3"
            freebsd_arch: x86_64
            apt: clang lld llvm
          - name: freebsd-aarch64
            toolchain: cmake/toolchains/aarch64-unknown-freebsd.cmake
            freebsd: "14.3"
            freebsd_arch: aarch64
            apt: clang lld llvm
    env:
      CCACHE_DIR: ~/.ccache
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
      CCACHE_COMPRESSLEVEL: "6"
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $DEBIAN_DEPS ${{ matrix.apt }}
    - name: Install musl cross toolchain
      if: ${{ matrix.musl }}
      run: |
        curl -fLO https://musl.cc/${{ matrix.musl }}.tgz
        sudo tar -xzf ${{ matrix.musl }}.tgz -C /opt
        echo "/opt/${{ matrix.musl }}/bin" >> $GITHUB_PATH
    - name: Install FreeBSD cross environment
      if: ${{ matrix.freebsd }}
      run: |
        sudo mkdir -p /opt/freebsd-cross
        sudo chown $(id -u) /opt/freebsd-cross
        sh scripts/setup-freebsd-cross.sh ${{ matrix.freebsd }} /opt/freebsd-cross ${{ matrix.freebsd_arch }}
        echo "/opt/freebsd-cross/bin" >> $GITHUB_PATH
    - name: Enable ccache
      run: |
        # gcc, binutils, gdb and newlib are autotools: they honour no CMake
        # variable, and a shim directory in PATH is the only way they pick
        # ccache up. Listing it leaves the covered compilers in the log.
        if [ -x /usr/sbin/update-ccache-symlinks ]; then
          sudo /usr/sbin/update-ccache-symlinks
        fi
        ls /usr/lib/ccache
        echo /usr/lib/ccache >> $GITHUB_PATH
    - name: ccache
      uses: actions/cache@v6
      with:
        path: ~/.ccache
        key: stage2-${{ matrix.name }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          stage2-${{ matrix.name }}-ccache-${{ github.ref }}-
          stage2-${{ matrix.name }}-ccache-
    - name: downloads
      uses: actions/cache@v6
      with:
        path: build/downloads
        key: ${{ runner.os }}-downloads-${{ hashFiles('CMakeLists.txt', 'cmake/Components.cmake') }}
        restore-keys: |
          ${{ runner.os }}-downloads-
    - name: Fetch stage-1 SDK
      uses: actions/download-artifact@v7
      with:
        name: vitasdk-linux
        path: stage1-artifact
    - name: Unpack stage-1 SDK
      run: |
        mkdir -p stage1
        tar -xjf stage1-artifact/*.tar.bz2 -C stage1
        STAGE1_DIR=$(dirname "$(dirname "$(dirname "$(find "$PWD/stage1" -type f -path '*/arm-vita-eabi/lib/libc.a' | head -1)")")")
        test -n "$STAGE1_DIR"
        echo "STAGE1_DIR=$STAGE1_DIR" >> $GITHUB_ENV
        echo "$STAGE1_DIR/bin" >> $GITHUB_PATH
    - name: Build
      run: |
        git config --global user.email "builds@ci.invalid"
        git config --global user.name "CI"
        unset CC CXX
        mkdir -p build
        cd build
        cmake .. \
          -DCMAKE_TOOLCHAIN_FILE=${{ matrix.toolchain }} \
          -DVITASDK_STAGE1_DIR="$STAGE1_DIR"
        make -j$(nproc) tarball
    - name: ccache statistics
      if: ${{ always() }}
      run: ccache --show-stats
    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: vitasdk-${{ matrix.name }}
        path: build/*.tar.bz2

  # ---------------------------------------------------------------------
  # Stage 2, native hosts. These runners are the product's host: arm64
  # Linux and both macOS architectures, none of which can execute the
  # stage-1 x86_64 Linux binaries. They do not have to: the target half
  # arrives as data, nothing here compiles target code, and so no native
  # arm-vita-eabi compiler is built on them either.
  #
  # macOS could not be cross built anyway -- osxcross needs a macOS SDK
  # extracted from Xcode, whose license restricts it to Apple hardware.
  # A toolchain file (cmake/toolchains/*-apple-darwin.cmake) is provided
  # for environments where that is already settled.
  # ---------------------------------------------------------------------
  stage2-native:
    needs: stage1-linux
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            name: linux-arm64
            ccache_dir: ~/.ccache
          - runner: macos-14
            name: macos-arm64
            ccache_dir: ~/Library/Caches/ccache
          - runner: macos-13
            name: macos-x86_64
            ccache_dir: ~/Library/Caches/ccache
    runs-on: ${{ matrix.runner }}
    env:
      CCACHE_DIR: ${{ matrix.ccache_dir }}
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "1"
      CCACHE_COMPRESSLEVEL: "6"
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
    - name: Install dependencies
      run: |
        if [ "$RUNNER_OS" = "macOS" ]; then
          brew install autoconf automake libtool texinfo ccache
        else
          sudo apt-get update
          sudo apt-get install -y $DEBIAN_DEPS
        fi
    - name: Enable ccache
      run: |
        # See the note in stage1-linux: the autotools sub-builds only pick
        # ccache up through a shim directory in PATH.
        if [ "$RUNNER_OS" = "macOS" ]; then
          shims="$(brew --prefix ccache)/libexec"
        else
          if [ -x /usr/sbin/update-ccache-symlinks ]; then
            sudo /usr/sbin/update-ccache-symlinks
          fi
          shims=/usr/lib/ccache
        fi
        ls "$shims"
        echo "$shims" >> $GITHUB_PATH
    - name: ccache
      uses: actions/cache@v6
      with:
        path: ${{ matrix.ccache_dir }}
        key: stage2-${{ matrix.name }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          stage2-${{ matrix.name }}-ccache-${{ github.ref }}-
          stage2-${{ matrix.name }}-ccache-
    - name: downloads
      uses: actions/cache@v6
      with:
        path: build/downloads
        key: ${{ matrix.name }}-downloads-${{ hashFiles('CMakeLists.txt', 'cmake/Components.cmake') }}
        restore-keys: |
          ${{ matrix.name }}-downloads-
    - name: Fetch stage-1 SDK
      uses: actions/download-artifact@v7
      with:
        name: vitasdk-linux
        path: stage1-artifact
    - name: Unpack stage-1 SDK
      run: |
        mkdir -p stage1
        tar -xjf stage1-artifact/*.tar.bz2 -C stage1
        STAGE1_DIR=$(dirname "$(dirname "$(dirname "$(find "$PWD/stage1" -type f -path '*/arm-vita-eabi/lib/libc.a' | head -1)")")")
        test -n "$STAGE1_DIR"
        echo "STAGE1_DIR=$STAGE1_DIR" >> $GITHUB_ENV
    - name: Build
      run: |
        git config --global user.email "builds@ci.invalid"
        git config --global user.name "CI"
        mkdir -p build
        cd build
        cmake .. -DVITASDK_STAGE1_DIR="$STAGE1_DIR"
        make -j$(getconf _NPROCESSORS_ONLN) tarball
    - name: ccache statistics
      if: ${{ always() }}
      run: ccache --show-stats
    - name: Upload artifacts
      if: ${{ success() }}
      uses: actions/upload-artifact@v7
      with:
        name: vitasdk-${{ matrix.name }}
        path: build/*.tar.bz2
